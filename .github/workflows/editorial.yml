name: Editorial refresh

on:
  schedule:
    - cron: "0 4 * * *"
  # 04:00 UTC, 09:30 IST. Late enough to have the whole previous UK news day
  # (which runs to about 22:00 UTC), early enough that the PR is waiting when
  # you start work, and before the digest at 06:30 so subscribers get today.
  workflow_dispatch:
    inputs:
      no_notes:
        description: "Skip phase 4 (no model calls)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: editorial
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scripts/requirements.txt

      # Guard the rules before they touch live data. The golden set costs
      # nothing to run because it replays recorded model output, so there is
      # no reason not to run it on every single execution.
      - name: Test
        run: python -m pytest scripts/tests -q

      - name: Golden set
        run: python scripts/run_evals.py --suite pipeline

      # Phases 1 and 2. Fails soft: if the feeds are down or extraction
      # breaks, an empty evidence file turns the run into a pure decay pass,
      # which is still a correct thing to publish.
      - name: Ingest and extract
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TI_EXTRACT_MODEL: claude-haiku-4-5-20251001
        run: |
          mkdir -p build
          python scripts/run_ingest.py \
            --data data.json \
            --out build \
            --window-hours 36 \
            --max-batches 12

      # The ingest step above is allowed to fail so a dead feed cannot stop the
      # decay pass. That tolerance is what let a missing API key run silently
      # for days, publishing a green tick and no new deals. This turns that
      # state back into a visible failure.
      # What the run cost, in the job summary. A number nobody can see is a
      # number nobody notices growing.
      - name: Extraction cost
        if: always()
        run: python scripts/report_cost.py --stats build/ingest_stats.json

      - name: Ingestion health
        run: python scripts/check_ingest.py --stats build/ingest_stats.json

      - name: Guarantee an evidence file
        if: always()
        run: '[ -f build/evidence.json ] || echo "{}" > build/evidence.json' 

      - name: Score and write notes
        id: editorial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Haiku handles a one-sentence note against an explicit rules block,
          # and costs roughly a third of Sonnet. Revert if quality drops.
          TI_NOTE_MODEL: claude-haiku-4-5-20251001
        run: |
          python scripts/run_editorial.py \
            --data data.json \
            --evidence build/evidence.json \
            --recent-days auto \
            --out build \
            --max-notes 12 \
            --max-changes 15 \
            ${{ inputs.no_notes && '--no-notes' || '' }} \
            --apply

      # Rendering is a build step, not an editorial decision, so it runs
      # after the gate has already approved the content. It regenerates the
      # pre-rendered index, every deal and club page, the sitemap, the feed
      # and the Open Graph cards from the same data.json the gate just
      # checked, which is why they can never disagree with it.
      - name: Render the site
        run: python scripts/render_site.py --data data.json --template index.html --out .

      # Candidates are deals we do not track. They ride along in the PR body
      # so you can accept one in the same review, but they never touch
      # data.json on their own.
      - name: Assemble the PR body
        run: |
          cat build/patch.md > build/pr.md
          if [ -f build/candidates.md ]; then
            printf "\n\n---\n\n" >> build/pr.md
            cat build/candidates.md >> build/pr.md
          fi

      - name: Archive the run
        run: |
          mkdir -p logs
          cp build/patch.json "logs/$(date -u +%F).json"
          cp build/ingest_stats.json "logs/$(date -u +%F)-ingest.json" || true

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/editorial
          base: main
          title: "Editorial refresh: ${{ github.run_id }}"
          body-path: build/pr.md
          labels: auto/editorial
          commit-message: "chore: daily editorial refresh"
          # Everything the render step regenerates, not just the data.
          #
          # This listed only data.json, data.js and logs/, so the rendered
          # output was produced on every run and committed on none of it.
          # The browser app would have kept working, because it reads data.js,
          # and everything underneath it would have frozen: deal pages, club
          # pages, the pre-rendered index a crawler sees, the sitemap that
          # tells Google a new deal exists, the RSS feed, and the Open Graph
          # cards that make a shared link look like anything. All silent, all
          # invisible from the PR, because the files were never in the diff.
          add-paths: |
            data.json
            data.js
            index.html
            404.html
            sitemap.xml
            feed.xml
            llms.txt
            deals/
            clubs/
            thanks/
            og/
            logs/
          delete-branch: true

      # Hands-off operation, opt in by setting the repository variable
      # AUTO_MERGE to 'true' (Settings, Secrets and variables, Actions,
      # Variables).
      #
      # This merges from inside the workflow rather than using GitHub's
      # auto-merge feature, because auto-merge cannot work here. It only
      # appears on a pull request that is blocked by something, which means
      # branch protection with a required status check, and a pull request
      # opened with the default GITHUB_TOKEN does not trigger `pull_request`
      # workflows at all. The required check would never run, and the pull
      # request would sit blocked forever waiting for it.
      #
      # The pull request is still created and still holds the full patch, so
      # the audit trail is unchanged. What is given up is a human reading the
      # patch before it goes live rather than after. The gate still runs and
      # still fails the build, so this does not loosen what can be published,
      # only who has looked at it first.
      - name: Merge it
        if: >-
          vars.AUTO_MERGE == 'true'
          && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Auto-merging PR #${{ steps.pr.outputs.pull-request-number }}"
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --squash --delete-branch

      - name: Say what happened
        if: always() && steps.pr.outputs.pull-request-number
        run: |
          {
            echo "## Editorial refresh"
            echo
            echo "PR #${{ steps.pr.outputs.pull-request-number }}: ${{ steps.pr.outputs.pull-request-url }}"
            if [ "${{ vars.AUTO_MERGE }}" = "true" ]; then
              echo "Merged automatically. Set the AUTO_MERGE repository"
              echo "variable to anything else to go back to reviewing first."
            else
              echo "Waiting for you to merge it. The digest reads main at"
              echo "06:30 UTC, so an unmerged PR means today's email"
              echo "describes yesterday."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
